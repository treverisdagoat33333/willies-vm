<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- copy.sh refuses image downloads whose Referer is another site (hotlink protection), and
     answers ones with none. Without this every system fails with a 403. -->
<meta name="referrer" content="no-referrer">
<title>Linux VM</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0d12;color:#e6e8ee;font:14px system-ui,sans-serif}
  #pick{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100%;padding:24px 16px;box-sizing:border-box;text-align:center;overflow:auto}
  #pick h1{margin:0;font-size:22px}
  #pick p{margin:0;color:#9aa3b2;max-width:560px}
  .lx-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:960px}
  .lx-os{background:#161a23;border:2px solid #262c3a;border-radius:12px;padding:12px 16px;width:220px;cursor:pointer;color:inherit;text-align:left;font:inherit;position:relative}
  .lx-os b{display:block;font-size:15px;margin-bottom:4px}
  .lx-os small{color:#9aa3b2}
  .lx-os i{position:absolute;top:8px;right:10px;font-style:normal;font-size:11px;background:#23324f;color:#9cc0ff;border-radius:6px;padding:1px 6px}
  .lx-os[aria-pressed="true"]{border-color:#5b8cff;background:#1a2133}
  .lx-opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
  select,button.go,button.alt{font:inherit;border-radius:8px;border:1px solid #2d3445;background:#161a23;color:inherit;padding:8px 12px}
  button.go{background:#5b8cff;border-color:#5b8cff;color:#fff;font-weight:600;padding:10px 22px;cursor:pointer}
  button.alt{cursor:pointer}
  #saved{display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;color:#9aa3b2}
  #run{display:none;flex-direction:column;height:100%}
  #bar{position:relative;z-index:2;display:flex;gap:6px;align-items:center;padding:6px 10px;background:#11141b;border-bottom:1px solid #222838;font-size:13px;flex-wrap:wrap}
  #bar span{color:#9aa3b2;flex:1;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar button{font:inherit;font-size:12px;border-radius:6px;border:1px solid #2d3445;background:#1a1f2b;color:inherit;padding:4px 10px;cursor:pointer}
  #bar button:disabled{opacity:.4;cursor:default}
  #screen{flex:1;min-height:0;display:flex;overflow:auto;background:#000;position:relative}
  #screen>div,#screen canvas{margin:auto}
  #screen>div{white-space:pre;font:14px/1 monospace;color:#ddd}
  #screen canvas{display:none;max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
  #screen.s1 canvas{max-width:none;max-height:none}
  #screen.s2 canvas{max-width:none;max-height:none;zoom:2}
  #drop{display:none;position:absolute;inset:0;background:#5b8cff33;border:3px dashed #5b8cff;align-items:center;justify-content:center;font-size:18px;pointer-events:none}
  #screen.over #drop{display:flex}
  #paste{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;z-index:5}
  #paste>div{background:#161a23;border:1px solid #2d3445;border-radius:12px;padding:16px;width:min(480px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}
  #paste textarea{height:140px;font:13px monospace;background:#0b0d12;color:inherit;border:1px solid #2d3445;border-radius:8px;padding:8px;resize:vertical}
  #paste .r{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<div id="pick">
  <h1>A computer in your browser</h1>
  <p>Runs on this computer, inside this tab, with no time limit. Pick a system, then Start. Save it any time and carry on later from the same spot.</p>
  <div class="lx-row" id="oses"></div>
  <div class="lx-opts">
    <label>Memory <select id="ram">
      <option value="2048">2 GB</option>
      <option value="1024" selected>1 GB</option>
      <option value="512">512 MB</option>
      <option value="256">256 MB</option>
    </select></label>
    <label><input type="checkbox" id="net" checked> Internet</label>
  </div>
  <div id="saved"><span id="savedtxt"></span><button class="alt" id="resume">Resume save</button><button class="alt" id="forget">Delete save</button></div>
  <button class="go" id="go">Start fresh</button>
</div>
<div id="run">
  <div id="bar">
    <span id="status">Starting…</span>
    <button id="b-save" title="Save the whole machine on this device">💾 Save</button>
    <button id="b-paste" title="Type text into the VM">📋 Paste</button>
    <button id="b-copy" title="Copy the text on screen (terminal systems)">Copy screen</button>
    <button id="b-up" title="Put a file into the VM">⬆ File in</button>
    <button id="b-down" title="Get a file out of the VM">⬇ File out</button>
    <button id="b-cad" title="Send Ctrl+Alt+Delete">Ctrl+Alt+Del</button>
    <button id="b-scale" title="Screen size">Fit</button>
    <button id="b-full" title="Full screen">⛶</button>
    <button id="reset">Restart</button>
  </div>
  <div id="screen"><div></div><canvas></canvas><div id="drop">Drop to put the file in the VM</div></div>
</div>
<div id="paste"><div>
  <b>Paste into the VM</b>
  <textarea id="paste-t" placeholder="Text here is typed into the VM, as if from the keyboard"></textarea>
  <div class="r"><button class="alt" id="paste-x">Cancel</button><button class="go" id="paste-ok">Type it</button></div>
</div></div>
<input type="file" id="file" hidden multiple>
<script type="module">
import { V86 } from "/v86/libv86.mjs";

// The emulator, its wasm and the BIOS are ours (/v86/, /vm-bios/). The OS images come from
// copy.sh, v86's own host, which sends CORS headers, so our COEP header lets them load.
const BIOS = "/vm-bios/";
const IMAGES = "https://i.copy.sh/";
// `mem` pins the memory size: a saved start-up state only fits the size it was made with.
// `files` says where dropped files land; only systems with v86's shared folder (9p) have one.
const OSES = {
  arch: { name: "Arch Linux", tag: "Best", desc: "A real, up-to-date Linux with a package manager (pacman). Starts in seconds. Terminal; type ./startx.sh for a desktop.",
    mem: 512, net: "virtio", files: "/root/", cfg: { initial_state: { url: IMAGES + "arch_state-v3.bin.zst" }, filesystem: { baseurl: IMAGES + "arch/" } },
    netHelp: "Internet: type ./networking.sh first" },
  tinycore: { name: "Tiny Core Linux", desc: "Small desktop with windows and a mouse. Boots in about a minute.",
    cfg: { cdrom: { url: IMAGES + "TinyCore-11.0.iso", size: 19922944 } } },
  buildroot: { name: "Buildroot Linux", desc: "Tiny terminal Linux. Boots in a few seconds.", files: "/mnt/",
    cfg: { bzimage: { url: IMAGES + "buildroot-bzimage68.bin", size: 10068480 }, cmdline: "tsc=reliable mitigations=off random.trust_cpu=on", filesystem: {} } },
  dsl: { name: "Damn Small Linux", desc: "Old-school small desktop with a web browser.",
    cfg: { cdrom: { url: IMAGES + "dsl-4.11.rc2.iso", size: 52824064 } } },
  reactos: { name: "ReactOS", desc: "Free, Windows-like system that runs many Windows programs. Big download; starts already booted.",
    mem: 512, net: "virtio", cfg: { hda: { url: IMAGES + "reactos-v3/.img", size: 734003200, async: true, fixed_chunk_size: 1024 * 1024, use_parts: true },
      initial_state: { url: IMAGES + "reactos_state-v3.bin.zst" }, mac_address_translation: true, acpi: true } },
  kolibri: { name: "KolibriOS", desc: "A whole desktop on one floppy disk. Very fast.",
    cfg: { fda: { url: IMAGES + "kolibri.img", size: 1474560 } } },
  freedos: { name: "FreeDOS", desc: "Free DOS, for old programs and games.",
    cfg: { fda: { url: IMAGES + "freedos722.img", size: 737280 } } },
};

const $ = (s) => document.querySelector(s);
const MB = (mb) => (mb >= 1024 ? mb / 1024 + " GB" : mb + " MB");
let os = "arch", emu = null, info = "";
const say = (t) => { $("#status").textContent = t; };
const flash = (t) => { say(t); clearTimeout(flash.t); flash.t = setTimeout(() => say(info), 4000); };

for (const [id, o] of Object.entries(OSES)) {
  const b = document.createElement("button");
  b.className = "lx-os"; b.dataset.os = id; b.setAttribute("aria-pressed", id === os);
  b.innerHTML = `${o.tag ? `<i>${o.tag}</i>` : ""}<b></b><small></small>`;
  b.querySelector("b").textContent = o.name; b.querySelector("small").textContent = o.desc;
  b.onclick = () => { os = id; for (const x of document.querySelectorAll(".lx-os")) x.setAttribute("aria-pressed", x === b); pickChanged(); };
  $("#oses").append(b);
}

/* ---------- saves: one per system, in IndexedDB on this device ---------- */
const db = new Promise((ok, no) => {
  try {
    const r = indexedDB.open("wvm-linux", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("saves");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  } catch (e) { no(e); }
});
async function store(mode, fn) {
  const d = await db;
  return new Promise((ok, no) => { const t = d.transaction("saves", mode); const r = fn(t.objectStore("saves")); t.oncomplete = () => ok(r?.result); t.onerror = () => no(t.error); });
}
const getSave = (id) => store("readonly", (s) => s.get(id)).catch(() => null);
const putSave = (id, v) => store("readwrite", (s) => s.put(v, id));
const delSave = (id) => store("readwrite", (s) => s.delete(id));

async function pickChanged() {
  const o = OSES[os];
  $("#ram").disabled = !!o.mem;
  if (o.mem) $("#ram").title = `${o.name} always uses ${MB(o.mem)}`; else $("#ram").title = "";
  const s = await getSave(os);
  $("#saved").style.display = s ? "flex" : "none";
  $("#go").textContent = s ? "Start fresh" : "Start";
  if (s) $("#savedtxt").textContent = `Saved ${new Date(s.at).toLocaleString()} (${Math.round(s.state.byteLength / 1048576)} MB)`;
}
pickChanged();

// A device that can't hand one tab the memory asked for gets the next size down.
function memoryFits(mb) {
  const pages = Math.min((mb + 64) * 16, 65536);
  try { new WebAssembly.Memory({ initial: pages, maximum: pages }); return true; }
  catch (_) { return false; }
}

async function start(resume) {
  const o = OSES[os];
  const want = o.mem || +$("#ram").value;
  const mb = o.mem || [2048, 1024, 512, 256].filter((m) => m <= want).find(memoryFits) || 256;
  const note = mb < want ? ` (wanted ${MB(want)}, this device couldn't spare it)` : "";
  const saved = resume ? await getSave(os) : null;
  $("#pick").style.display = "none";
  $("#run").style.display = "flex";
  $("#b-up").disabled = $("#b-down").disabled = !o.files;
  const net = $("#net").checked;
  info = `${o.name} · ${MB(saved?.mem || mb)}${note}${net ? " · internet on" : ""} · click the screen to use it, Esc frees the mouse`;
  say(`Downloading ${o.name}…`);
  const cfg = { ...o.cfg };
  // A save holds the whole machine, so it replaces the stock start-up state.
  if (saved) cfg.initial_state = { buffer: saved.state };
  // The VM's network goes through our own Wisp server (the same one the proxy uses). Its
  // name lookups go over DNS-over-HTTPS from this tab.
  const relay = (location.protocol === "https:" ? "wisps://" : "wisp://") + location.host + "/wisp/";
  emu = new V86({
    wasm_path: "/v86/v86.wasm",
    memory_size: Math.min(saved?.mem || mb, 4095) * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    screen_container: $("#screen"),
    bios: { url: BIOS + "seabios.bin" },
    vga_bios: { url: BIOS + "vgabios.bin" },
    acpi: false,
    disable_speaker: true,
    autostart: true,
    ...cfg,
    ...(net ? { net_device: { type: o.net || "ne2k", relay_url: relay } } : {}),
  });
  emu.add_listener("download-progress", (e) => {
    if (e.total && e.file_count <= 3) say(`Downloading ${o.name}… ${Math.round((e.loaded / e.total) * 100)}%`);
  });
  emu.add_listener("emulator-ready", () => {
    if (net && o.netHelp && !saved) info += " · " + o.netHelp;
    say(info);
  });
  emu.add_listener("download-error", () => say("Couldn't download the system. Check your connection, then press Restart."));
  emu.__mb = saved?.mem || mb;
}

$("#go").onclick = () => start(false);
$("#resume").onclick = () => start(true);
$("#forget").onclick = async () => { if (confirm("Delete this save?")) { await delSave(os); pickChanged(); } };
$("#reset").onclick = () => { try { emu?.destroy(); } catch (_) {} location.reload(); };
$("#screen").addEventListener("click", () => emu?.lock_mouse?.());

/* ---------- bar buttons ---------- */
$("#b-save").onclick = async () => {
  if (!emu) return;
  $("#b-save").disabled = true; say("Saving…");
  try {
    const state = await emu.save_state();
    await putSave(os, { state, mem: emu.__mb, at: Date.now() });
    flash(`Saved (${Math.round(state.byteLength / 1048576)} MB). Pick ${OSES[os].name} and Resume save next time.`);
  } catch (e) {
    flash("Couldn't save: " + (/quota/i.test(e?.name + e?.message) ? "this device is out of space for it." : e?.message || e));
  }
  $("#b-save").disabled = false;
};

$("#b-paste").onclick = () => {
  $("#paste-t").value = ""; $("#paste").style.display = "flex"; $("#paste-t").focus();
  // the box opens at once; the clipboard fills it only if the browser allows it (it may ask first)
  navigator.clipboard?.readText?.().then((t) => { if (t && !$("#paste-t").value) $("#paste-t").value = t; }, () => {});
};
$("#paste-x").onclick = () => { $("#paste").style.display = "none"; };
$("#paste-ok").onclick = () => {
  const t = $("#paste-t").value.replace(/\r\n?/g, "\n");
  $("#paste").style.display = "none";
  // a small gap between keys, or old systems drop some of them
  if (t) emu?.keyboard_send_text(t, 4);
};

$("#b-copy").onclick = async () => {
  const text = $("#screen>div").innerText.replace(/[  ]+$/gm, "").trim();
  if (!text) return flash("Nothing to copy: this system draws its screen as a picture.");
  try { await navigator.clipboard.writeText(text); flash("Copied the screen's text."); }
  catch (_) { flash("The browser wouldn't allow copying."); }
};

async function putFiles(list) {
  const dir = OSES[os].files;
  if (!emu || !dir) return flash("This system can't take files. Arch and Buildroot can.");
  for (const f of list) {
    try { await emu.create_file(dir + f.name, new Uint8Array(await f.arrayBuffer())); flash(`Put ${f.name} in ${dir}`); }
    catch (_) { flash(`Couldn't put ${f.name} in the VM.`); }
  }
}
$("#b-up").onclick = () => $("#file").click();
$("#file").onchange = () => { putFiles([...$("#file").files]); $("#file").value = ""; };
const scr = $("#screen");
scr.addEventListener("dragover", (e) => { e.preventDefault(); scr.classList.add("over"); });
scr.addEventListener("dragleave", () => scr.classList.remove("over"));
scr.addEventListener("drop", (e) => { e.preventDefault(); scr.classList.remove("over"); putFiles([...e.dataTransfer.files]); });

$("#b-down").onclick = async () => {
  const dir = OSES[os].files;
  const path = prompt("Which file? (full path inside the VM)", dir);
  if (!path || path.endsWith("/")) return;
  try {
    const bytes = await emu.read_file(path);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes]));
    a.download = path.split("/").pop();
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (_) { flash(`Couldn't find ${path}`); }
};

// Ctrl down, Alt down, Delete down, then each up again (PS/2 scancodes)
$("#b-cad").onclick = () => emu?.keyboard_send_scancodes([0x1d, 0x38, 0xe0, 0x53, 0xe0, 0xd3, 0xb8, 0x9d]);

const SCALES = [["", "Fit"], ["s1", "1×"], ["s2", "2×"]];
let scale = 0;
$("#b-scale").onclick = () => {
  scr.classList.remove("s1", "s2");
  scale = (scale + 1) % SCALES.length;
  if (SCALES[scale][0]) scr.classList.add(SCALES[scale][0]);
  $("#b-scale").textContent = SCALES[scale][1];
};
$("#b-full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else (scr.requestFullscreen || scr.webkitRequestFullscreen)?.call(scr);
};
</script>
</body>
</html>
