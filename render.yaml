services:
  - type: web
    name: willie-games-vm
    env: node
    buildCommand: npm install
    startCommand: npm start

    # The SQLite database lives at DATA_DIR (defaults to ./data).
    #
    # On the free plan that directory is ephemeral: accounts and chat history
    # survive restarts of a running instance, but are wiped on redeploy and
    # when the instance spins down. To make them permanent, add payment info
    # and uncomment the disk below plus the DATA_DIR env var.
    #
    # disk:
    #   name: willies-vm-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      # Marks session cookies Secure (https only). The server also detects
      # Render on its own, but set it anyway for clarity.
      - key: NODE_ENV
        value: production

      - key: XENV_API_KEY
        sync: false

      - key: XENV_DEV_ID
        value: willie-games-vm

      - key: E2B_API_KEY
        sync: false

      - key: AUTH_SECRET
        sync: false

      # The account that holds the owner role.
      - key: OWNER_USERNAME
        value: william

      # Locks the owner account. Whenever the database comes up without it
      # (on the free plan: every deploy and every spin-down), the server
      # creates OWNER_USERNAME with this password before it accepts any
      # traffic, so nobody else can register the name first. At least 8
      # characters. A password you change on the site lasts until the next
      # wipe, then this one is back.
      - key: OWNER_PASSWORD
        sync: false

      # Most VMs the whole site runs at once (default 20). The owner is
      # exempt, as from the per-person limits.
      # - key: MAX_LIVE_VMS
      #   value: "20"

      # Secret that gates remote desktop control. Set the SAME value here and
      # when you run the agent on your PC. Leave it unset to keep the feature
      # off entirely.
      - key: REMOTE_KEY
        sync: false

      # - key: DATA_DIR
      #   value: /var/data
